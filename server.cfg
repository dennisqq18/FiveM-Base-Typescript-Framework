endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Rumble Development"
sets sv_projectName "Rumble Framework"
sets sv_projectDesc "Standalone TypeScript FiveM framework"
sets locale "en-US"
sets tags "roleplay,typescript,standalone"

sv_maxclients 8
sv_scriptHookAllowed 0
set rumble_min_character_age 18

sv_licenseKey "CHANGE_ME_CFX_LICENSE_KEY"

set onesync on
set mysql_connection_string "mysql://root@127.0.0.1/rumble?charset=utf8mb4"

set rumble_default_cash 500
set rumble_default_card 5000
set rumble_max_money 2000000000
set rumble_max_item_operation 1000
set rumble_max_rpc_payload_bytes 16384
set rumble_max_metadata_bytes 16000
set rumble_security_log_window_ms 10000
set rumble_max_characters 5

set rumble_needs_interval_ms 60000
set rumble_autosave_interval_ms 30000
set rumble_hunger_decay 1
set rumble_thirst_decay 1
set rumble_starvation_damage 5
set rumble_dehydration_damage 5

set rumble_inventory_max_weight 30000
set rumble_inventory_max_slots 40
set rumble_death_dead_after_ms 60000

set rumble_admin_identifier "license:CHANGE_ME_ADMIN_LICENSE"

ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure oxmysql
ensure core
